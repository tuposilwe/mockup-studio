[package]
name = "mockup_studio"
version = "0.2.1"
edition = "2021"
default-run = "mockup_studio"

[[bin]]
name = "mockup_studio"
path = "src/main.rs"

[package.metadata.bundle]
name = "Mockup Studio"
identifier = "com.mockupstudio.app"
icon = ["packaging/AppIcon.icns"]

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
